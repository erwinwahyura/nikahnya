<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erwin &amp; Farras — 2 Juli 2026</title>
  <meta name="description" content="Undangan Akad Nikah Erwin Wahyu Ramadhan & Farras Caesarmas Putri — Kamis, 2 Juli 2026" />

  <!-- Open Graph (WhatsApp preview) -->

  <meta property="og:description" content="Kamis, 2 Juli 2026 · KUA Kembangan, Jakarta Barat" />
  <meta property="og:image" content="assets/cover.png" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="style.css" />
  <audio id="bg-music" src="assets/music.mp3" loop preload="none"></audio>

<body>

<!-- Music toggle -->
<button id="music-btn" aria-label="Toggle music">🔇</button>

<div class="card">

  <!-- 1. Cover -->
  <section id="cover">
    <img src="assets/cover.png" alt="Erwin & Farras" />
  </section>

  <!-- 2. Quran verse -->
  <section id="quran">
    <img src="assets/quran.png" alt="QS. Ar-Rum 21" />
  </section>

  <!-- 3. Invitation details -->
  <section id="invitation">
    <img src="assets/event.png" alt="Detail undangan" />
  </section>

  <!-- 4. Countdown -->
  <section id="countdown">
    <h2>Menuju Hari Bahagia</h2>
    <div class="countdown-grid">
      <div class="countdown-item">
        <span class="countdown-num" id="days">00</span>
        <span class="countdown-label">Hari</span>
      </div>
      <span class="divider-dot">·</span>
      <div class="countdown-item">
        <span class="countdown-num" id="hours">00</span>
        <span class="countdown-label">Jam</span>
      </div>
      <span class="divider-dot">·</span>
      <div class="countdown-item">
        <span class="countdown-num" id="mins">00</span>
        <span class="countdown-label">Menit</span>
      </div>
      <span class="divider-dot">·</span>
      <div class="countdown-item">
        <span class="countdown-num" id="secs">00</span>
        <span class="countdown-label">Detik</span>
      </div>
    </div>
  </section>

  <!-- 5. Gift -->
  <section id="gift">
    <img src="assets/gift.png" alt="Informasi hadiah" />
  </section>
  <div class="gift-actions">
    <button class="copy-btn" id="copy-btn">🏦 &nbsp;Salin Nomor BCA</button>
    <a
      class="wa-btn"
      href="https://wa.me/6281290536767"
      target="_blank"
      rel="noopener noreferrer"
    >
      💬 &nbsp;Konfirmasi via WhatsApp
    </a>
  </div>

  <!-- 6. Closing -->
  <section id="closing">
    <img src="assets/closing.png" alt="Penutup" />
  </section>

  <footer>Made with ♡ for Erwin &amp; Farras · 2026</footer>
