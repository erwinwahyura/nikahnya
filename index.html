<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Erwin &amp; Farras — 2 Juli 2026</title>
  <meta name="description" content="Undangan Akad Nikah Erwin Wahyu Ramadhan & Farras Caesarmas Putri" />
  <meta property="og:title" content="Erwin & Farras — Undangan Akad Nikah" />
  <meta property="og:description" content="Kamis, 2 Juli 2026 · KUA Kembangan, Jakarta Barat" />
  <meta property="og:image" content="assets/cover.png" />
  <link rel="stylesheet" href="style.css" />
  <audio id="bg-music" src="assets/music.mp3" loop preload="none"></audio>
</head>
<body>
<div id="app">

  <!-- Story progress bars -->
  <div id="progress">
    <div class="seg"><div class="fill"></div></div>
    <div class="seg"><div class="fill"></div></div>
    <div class="seg"><div class="fill"></div></div>
    <div class="seg"><div class="fill"></div></div>
    <div class="seg"><div class="fill"></div></div>
    <div class="seg"><div class="fill"></div></div>
  </div>

  <!-- Music toggle -->
  <button id="music-btn" aria-label="Toggle music">♪</button>

  <!-- Slides -->
  <div id="slides">

    <!-- 0: Cover -->
    <div class="slide" data-state="active">
      <img src="assets/cover.png" alt="Erwin & Farras" />
      <p class="tap-hint">ketuk untuk membuka ›</p>
    </div>

    <!-- 1: Quran verse -->
    <div class="slide" data-state="right">
      <img src="assets/quran.png" alt="QS. Ar-Rum 21" />
    </div>

    <!-- 2: Invitation details -->
    <div class="slide" data-state="right">
      <img src="assets/event.png" alt="Detail undangan" />
    </div>

    <!-- 3: Countdown (custom HTML) -->
    <div class="slide countdown-slide" data-state="right">
      <div class="cd-card">
        <p class="cd-eyebrow">Insya Allah</p>
        <h2 class="cd-title">Menuju Hari Bahagia</h2>
        <div class="cd-grid">
          <div class="cd-cell"><b id="days">00</b><span>Hari</span></div>
          <div class="cd-sep">:</div>
          <div class="cd-cell"><b id="hours">00</b><span>Jam</span></div>
          <div class="cd-sep">:</div>
          <div class="cd-cell"><b id="mins">00</b><span>Menit</span></div>
          <div class="cd-sep">:</div>
          <div class="cd-cell"><b id="secs">00</b><span>Detik</span></div>
        </div>
        <p class="cd-date">Kamis, 2 Juli 2026</p>
        <p class="cd-venue">KUA Kembangan · Jakarta Barat</p>
      </div>
    </div>

    <!-- 4: Gift -->
    <div class="slide gift-slide" data-state="right">
      <img src="assets/gift.png" alt="Informasi hadiah" />
      <div class="gift-actions">
        <button class="copy-btn" id="copy-btn">🏦&nbsp; Salin Nomor BCA</button>
        <a class="wa-btn" href="https://wa.me/6281290536767" target="_blank" rel="noopener noreferrer">
          💬&nbsp; Konfirmasi via WhatsApp
        </a>
      </div>
    </div>

    <!-- 5: Closing -->
    <div class="slide" data-state="right">
      <img src="assets/closing.png" alt="Penutup" />
    </div>

  </div>

  <!-- Navigation bar -->
  <div id="nav">
    <button id="btn-prev" class="btn-ghost">‹</button>
    <div id="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <button id="btn-next" class="btn-primary">Lanjut ›</button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
